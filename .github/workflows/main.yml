name: Zip Folder

on:
  push:
    branches: [main]

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Zip folder
        run: |
          zip -r mon_dossier.zip Common

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon_dossier_zip
          path: mon_dossier.zip
